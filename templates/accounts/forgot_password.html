{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h4 class="text-center mb-2">🔑 Forgot Password?</h4>
          <p class="text-muted text-center small mb-4">
            Enter your registered mobile number or email. Your admin or distributor will reset your password.
          </p>
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Mobile Number or Email</label>
              <input type="text" name="identifier" class="form-control" placeholder="Enter mobile or email" required autofocus>
            </div>
            <button type="submit" class="btn btn-success w-100">Submit Request</button>
          </form>
          <div class="text-center mt-3 small">
            <a href="{% url 'accounts:login' %}" class="text-muted">← Back to Login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
