{% extends 'base.html' %}
{% load i18n %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h4 class="mb-4">Sign in</h4>
          <div class="mb-3">
            <span class="text-muted">{{ identifier }}</span>
            <a href="{% url 'accounts:login' %}" class="text-decoration-none ms-2 fw-semibold">Change</a>
          </div>
          {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} py-2 small">{{ message }}</div>
          {% endfor %}
          <form method="post">
            {% csrf_token %}
            <div class="mb-4">
              <label class="form-label fw-bold">Password</label>
              <input type="password" name="password" class="form-control px-3 py-2" required autofocus enterkeyhint="done">
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-semibold rounded-pill py-2 text-dark border-0">Sign in</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
document.querySelector('input[name="password"]').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); this.closest('form').submit(); }
});
</script>
{% endblock %}
