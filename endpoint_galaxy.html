<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>✨ My Shop Galaxy ✨</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #1a1148 0%, #0b0724 55%, #04020f 100%);
    font-family: 'Segoe UI', 'Trebuchet MS', system-ui, sans-serif;
    color: #fff; user-select: none; cursor: crosshair;
  }
  #sky { position: fixed; inset: 0; display: block; }
  .title {
    position: fixed; top: 18px; left: 0; right: 0; text-align: center;
    font-size: clamp(20px, 4vw, 40px); font-weight: 800; letter-spacing: 1px;
    pointer-events: none; z-index: 5;
    background: linear-gradient(90deg,#ff9be7,#9bc8ff,#9bffd0,#fff3a0,#ff9bb5);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 14px rgba(255,180,255,.4));
    animation: hue 10s linear infinite;
  }
  .subtitle {
    position: fixed; top: calc(18px + clamp(26px,4.6vw,48px)); left:0; right:0; text-align:center;
    font-size: clamp(11px,1.6vw,15px); color:#cbd0ff; opacity:.75; pointer-events:none; z-index:5;
  }
  @keyframes hue { to { filter: drop-shadow(0 0 14px rgba(255,180,255,.4)) hue-rotate(360deg); } }
  .hint {
    position: fixed; bottom: 14px; left: 0; right: 0; text-align: center;
    font-size: 13px; color: #aab0e8; opacity: .7; pointer-events: none; z-index: 5;
  }
  .tooltip {
    position: fixed; z-index: 10; pointer-events: none; transform: translate(-50%, -140%);
    background: rgba(14,10,40,.92); border: 1px solid rgba(255,255,255,.25);
    padding: 7px 12px; border-radius: 10px; font-size: 13px; white-space: nowrap;
    box-shadow: 0 6px 30px rgba(0,0,0,.5); opacity: 0; transition: opacity .12s;
  }
  .tooltip b { color: #ffe27a; }
  .tooltip .path { color: #9bffd0; font-family: Consolas, monospace; }
  .controls { position: fixed; top: 14px; right: 16px; z-index: 6; display:flex; gap:8px; }
  .controls button {
    background: rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.2);
    border-radius: 20px; padding: 6px 14px; font-size: 13px; cursor: pointer; backdrop-filter: blur(6px);
    transition: .15s;
  }
  .controls button:hover { background: rgba(255,255,255,.2); transform: translateY(-1px); }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="title">My Shop Galaxy</div>
<div class="subtitle">every glowing star is a page in Daddy's app ✨</div>
<div class="tooltip" id="tip"></div>
<div class="hint">Move your mouse to light up the stars · click a glowing world to make it sparkle 🌟</div>
<div class="controls">
  <button id="pulseBtn">💫 Send a wish</button>
  <button id="boomBtn">🎆 Fireworks</button>
</div>

<script>
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
const tip = document.getElementById('tip');
let W, H, DPR;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth = window.innerWidth;
  H = canvas.clientHeight = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', () => { resize(); layout(); });

// ----- The real app, as a galaxy. center -> modules -> endpoints -----
const MODULES = [
  { name: 'Home & Shop',      prefix: '/',              color: '#6ee7ff', kids: ['home','storefront','product list','product detail','search'] },
  { name: 'Accounts',         prefix: '/accounts/',     color: '#ffd166', kids: ['login','register','profile','addresses','change password'] },
  { name: 'Cart',             prefix: '/cart/',         color: '#ff8fb1', kids: ['cart','add','update','remove','checkout flow'] },
  { name: 'Orders',           prefix: '/orders/',       color: '#b794ff', kids: ['my orders','order detail','checkout','edit order'] },
  { name: 'Payments',         prefix: '/payments/',     color: '#7CFFB2', kids: ['payments center','settlements','history'] },
  { name: 'Supplier',         prefix: '/supplier/',     color: '#ffa94d', kids: ['dashboard','products','stock','restock'] },
  { name: 'Stockist',         prefix: '/stockist/',     color: '#4dd4ff', kids: ['dashboard','inventory','charges','direct supply','restock'] },
  { name: 'Marketplace',      prefix: '/distributor/',  color: '#f78fff', kids: ['dashboard','catalogue','my products','customers','my stock'] },
  { name: 'Distributor',      prefix: '/wholesale/',    color: '#9bffd0', kids: ['dashboard','shops','my stock','restock'] },
  { name: 'Rentals',          prefix: '/rentals/',      color: '#ffe27a', kids: ['browse','book','my rentals','wallet','publish'] },
  { name: 'Delivery',         prefix: '/delivery/',     color: '#67e8f9', kids: ['delivery list','mark out','mark delivered'] },
  { name: 'Support',          prefix: '/support/',      color: '#c0a9ff', kids: ['submit ticket','my tickets'] },
  { name: 'Admin Panel',      prefix: '/admin-panel/',  color: '#ff6b6b', kids: ['dashboard','users','products','orders','reports','distributors'] },
];

let nodes = [], links = [];
let center;

function layout() {
  nodes = []; links = [];
  const cx = W / 2, cy = H / 2 + 20;
  center = { x: cx, y: cy, bx: cx, by: cy, r: 26, color: '#ffffff',
             name: 'Shop', path: 'the whole app lives here', module: true, core: true,
             phase: Math.random()*6.28, amp: 6 };
  nodes.push(center);

  const R1 = Math.min(W, H) * 0.30;
  const n = MODULES.length;
  MODULES.forEach((m, i) => {
    const a = (i / n) * Math.PI * 2 - Math.PI/2;
    const mx = cx + Math.cos(a) * R1;
    const my = cy + Math.sin(a) * R1;
    const mod = { x: mx, y: my, bx: mx, by: my, r: 13, color: m.color,
                  name: m.name, path: m.prefix, module: true,
                  phase: Math.random()*6.28, amp: 9, angle: a };
    nodes.push(mod);
    links.push({ a: center, b: mod, color: m.color });

    const k = m.kids.length;
    const R2 = 78 + k * 7;
    m.kids.forEach((kid, j) => {
      const spread = 1.05;
      const ka = a + (j - (k - 1) / 2) * (spread / Math.max(k,1));
      const kx = mx + Math.cos(ka) * R2;
      const ky = my + Math.sin(ka) * R2;
      const leaf = { x: kx, y: ky, bx: kx, by: ky, r: 4.5, color: m.color,
                     name: kid, path: m.prefix + kid.replace(/ /g,'-') + '/', module: false,
                     phase: Math.random()*6.28, amp: 5 };
      nodes.push(leaf);
      links.push({ a: mod, b: leaf, color: m.color });
    });
  });
}

// ----- stars background -----
const stars = [];
function makeStars() {
  stars.length = 0;
  const count = Math.floor((W*H)/4500);
  for (let i=0;i<count;i++){
    stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.4+.2,
                 tw: Math.random()*6.28, sp: Math.random()*0.04+0.01 });
  }
}

// ----- traveling pulses along links -----
const pulses = [];
function spawnPulse(link) {
  pulses.push({ link, t: 0, speed: 0.004 + Math.random()*0.006, color: link.color, size: 2.5 + Math.random()*2 });
}
function autoPulse() {
  if (links.length && pulses.length < 60) {
    spawnPulse(links[(Math.random()*links.length)|0]);
  }
}

// ----- fireworks / sparkles -----
const sparks = [];
function burst(x, y, color, n=36, power=1) {
  for (let i=0;i<n;i++){
    const a = Math.random()*6.28, s = (Math.random()*3+1)*power;
    sparks.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1,
                  color: color || `hsl(${Math.random()*360},100%,70%)`, r: Math.random()*2+1 });
  }
}
function fireworks() {
  for (let i=0;i<6;i++){
    setTimeout(()=> burst(Math.random()*W, Math.random()*H*0.7+40, null, 50, 1.4), i*220);
  }
}

// ----- mouse -----
let mouse = { x: -999, y: -999 };
let hover = null;
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mouseleave', () => { mouse.x = mouse.y = -999; });
canvas.addEventListener('click', e => {
  // find nearest node
  let best = null, bd = 1e9;
  for (const nd of nodes){ const d=Math.hypot(nd.x-e.clientX, nd.y-e.clientY); if(d<bd){bd=d;best=nd;} }
  if (best && bd < 40) {
    burst(best.x, best.y, best.color, best.module?40:22, best.module?1.3:0.9);
    // send pulses out from it
    links.filter(l=>l.a===best||l.b===best).forEach(spawnPulse);
  } else {
    burst(e.clientX, e.clientY, null, 20, 0.8);
  }
});
document.getElementById('boomBtn').onclick = fireworks;
document.getElementById('pulseBtn').onclick = () => {
  // one wish travels from the center out to a random corner of the galaxy
  const outer = nodes.filter(n=>!n.module);
  if(!outer.length) return;
  const target = outer[(Math.random()*outer.length)|0];
  // light the chain center->module->leaf
  const modLink = links.find(l=>l.a===center && (l.b===target || links.some(x=>x.a===l.b&&x.b===target)));
  links.forEach(l=>{ if(l.a===center) spawnPulse(l); });
  burst(center.x, center.y, '#fff', 30, 1.2);
};

// ----- main loop -----
let t = 0;
function frame() {
  t += 0.016;
  ctx.clearRect(0,0,W,H);

  // stars
  for (const s of stars){
    s.tw += s.sp;
    const a = 0.4 + Math.abs(Math.sin(s.tw))*0.6;
    ctx.globalAlpha = a; ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // gentle float of nodes
  for (const nd of nodes){
    nd.x = nd.bx + Math.sin(t*0.7 + nd.phase) * nd.amp;
    nd.y = nd.by + Math.cos(t*0.6 + nd.phase) * nd.amp;
  }

  // hover detection
  hover = null; let hd = 1e9;
  for (const nd of nodes){ const d=Math.hypot(nd.x-mouse.x, nd.y-mouse.y); if(d<hd){hd=d;hover=nd;} }
  if (hd > 42) hover = null;

  // links
  ctx.lineCap = 'round';
  for (const l of links){
    const lit = hover && (l.a===hover || l.b===hover);
    ctx.strokeStyle = l.color;
    ctx.globalAlpha = lit ? 0.9 : 0.16;
    ctx.lineWidth = lit ? 2.2 : 1;
    ctx.beginPath(); ctx.moveTo(l.a.x, l.a.y); ctx.lineTo(l.b.x, l.b.y); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // pulses
  for (let i=pulses.length-1;i>=0;i--){
    const p = pulses[i]; p.t += p.speed;
    if (p.t >= 1){ // arrived -> tiny sparkle, maybe continue outward
      burst(p.link.b.x, p.link.b.y, p.color, 6, 0.5);
      // continue down to a child link
      const nxt = links.filter(l=>l.a===p.link.b);
      if (nxt.length) spawnPulse(nxt[(Math.random()*nxt.length)|0]);
      pulses.splice(i,1); continue;
    }
    const x = p.link.a.x + (p.link.b.x-p.link.a.x)*p.t;
    const y = p.link.a.y + (p.link.b.y-p.link.a.y)*p.t;
    const g = ctx.createRadialGradient(x,y,0,x,y,p.size*3);
    g.addColorStop(0, p.color); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,p.size*3,0,6.28); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x,y,p.size*0.7,0,6.28); ctx.fill();
  }

  // nodes
  for (const nd of nodes){
    const lit = (nd===hover) || (hover && links.some(l=>(l.a===hover&&l.b===nd)||(l.b===hover&&l.a===nd)));
    const pulse = 1 + Math.sin(t*2 + nd.phase)*0.12;
    const r = nd.r * pulse * (lit?1.5:1);
    // glow
    const g = ctx.createRadialGradient(nd.x,nd.y,0,nd.x,nd.y,r*4);
    g.addColorStop(0, nd.color); g.addColorStop(0.3, nd.color+'88'); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha = lit?0.9:0.5; ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(nd.x,nd.y,r*4,0,6.28); ctx.fill();
    // core
    ctx.globalAlpha = 1; ctx.fillStyle = nd.core ? '#fff' : nd.color;
    ctx.beginPath(); ctx.arc(nd.x,nd.y,r,0,6.28); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.globalAlpha = .9;
    ctx.beginPath(); ctx.arc(nd.x-r*0.3, nd.y-r*0.3, r*0.35, 0, 6.28); ctx.fill();
    ctx.globalAlpha = 1;
    // labels for modules
    if (nd.module && !nd.core){
      ctx.font = '600 12px Segoe UI, sans-serif'; ctx.textAlign='center';
      ctx.fillStyle = 'rgba(255,255,255,'+(lit?1:.8)+')';
      ctx.shadowColor='rgba(0,0,0,.8)'; ctx.shadowBlur=6;
      ctx.fillText(nd.name, nd.x, nd.y + r + 15); ctx.shadowBlur=0;
    }
    if (nd.core){
      ctx.font='800 15px Segoe UI'; ctx.textAlign='center'; ctx.fillStyle='#fff';
      ctx.shadowColor='rgba(120,160,255,.9)'; ctx.shadowBlur=14;
      ctx.fillText('🛒 '+nd.name, nd.x, nd.y - r - 12); ctx.shadowBlur=0;
    }
  }

  // sparks
  for (let i=sparks.length-1;i>=0;i--){
    const s=sparks[i]; s.x+=s.vx; s.y+=s.vy; s.vy+=0.03; s.vx*=0.98; s.life-=0.02;
    if(s.life<=0){ sparks.splice(i,1); continue; }
    ctx.globalAlpha=s.life; ctx.fillStyle=s.color;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fill();
  }
  ctx.globalAlpha=1;

  // tooltip
  if (hover){
    tip.style.opacity=1; tip.style.left=hover.x+'px'; tip.style.top=hover.y+'px';
    tip.innerHTML = '<b>'+hover.name+'</b><br><span class="path">'+hover.path+'</span>';
  } else tip.style.opacity=0;

  if (Math.random()<0.4) autoPulse();
  requestAnimationFrame(frame);
}

resize(); layout(); makeStars();
// opening celebration
setTimeout(()=>{ burst(W/2, H/2+20, '#fff', 50, 1.5); links.forEach((l,i)=> i%3===0 && spawnPulse(l)); }, 400);
frame();
</script>
</body>
</html>
